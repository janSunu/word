<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>워드봉사 검수기</title>
<style>
@font-face { font-family: "Pretendard"; font-weight: 400; font-display: swap; src: url("fonts/Pretendard-Regular.subset.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 700; font-display: swap; src: url("fonts/Pretendard-Bold.subset.woff2") format("woff2"); }
/* 한 줄 머리글, 그 아래 원고 한 장. 상자 없이 글자와 밑줄만으로 구분한다. */
:root {
  --bg: #ffffff;
  --ink: #16181a;
  --muted: #8a9096;
  --hair: #e6e8ea;
  --orange: #e8590c;
  --blue: #1c6fd6;
  --font: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121314; --ink: #e8eaec; --muted: #7d848b; --hair: #2a2d30; --orange: #ff8a3d; --blue: #6aa8ff; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121314; --ink: #e8eaec; --muted: #7d848b; --hair: #2a2d30; --orange: #ff8a3d; --blue: #6aa8ff; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.75; }
button, input, select, textarea { font: inherit; color: inherit; }
.page { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 36px; }
.brand { margin: 0; font-size: 24px; line-height: 1; font-weight: 400; }
svg.rt { display: inline-block; overflow: visible; }
.row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; }
.t { background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); text-underline-offset: 4px; }
.t:hover { text-decoration: underline; }
.t.strong { font-weight: 700; }
.t.dim { color: var(--muted); }
.t:disabled { color: var(--muted); cursor: default; text-decoration: none; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
#src { display: block; width: 100%; min-height: 62vh; border: 0; padding: 0; margin: 0 0 24px; background: transparent; resize: vertical; line-height: 1.75; white-space: pre; overflow: auto; tab-size: 4; outline: none; }
#src::placeholder { color: var(--muted); }
body.drag #src { color: var(--muted); }
#summary { margin: 0 0 6px; }
#summary .o { color: var(--orange); font-weight: 700; }
#summary .b { color: var(--blue); font-weight: 700; }
#summary .i { color: var(--muted); font-weight: 700; }
#summary svg.rt { font-size: 1em; }
#ractions { margin-bottom: 28px; }
.sepd { gap: 6px 0; }
.sepd > .t:not([hidden]) ~ .t:not([hidden])::before { content: "|"; display: inline-block; margin: 0 12px; color: var(--muted); font-weight: 400; opacity: .6; }
#progress:empty, #global:empty { display: none; }
#progress { margin: -16px 0 24px; }
#global { margin: 0 0 28px; display: grid; gap: 4px; }
#global .gl { color: var(--orange); margin-right: 10px; font-weight: 700; }
#doc { font-variant-ligatures: none; }
.ln { display: grid; grid-template-columns: 3.2em 1fr; column-gap: 14px; content-visibility: auto; contain-intrinsic-size: auto 26px; }
.ln .no { text-align: right; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; user-select: none; padding-top: 3px; }
.ln .tx { white-space: pre-wrap; word-break: break-all; min-height: 1.75em; }
.ln.flash .no { color: var(--ink); font-weight: 700; }
.sp { display: inline-block; min-width: .5em; position: relative; }
.sp::after { content: "·"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); line-height: 1; color: var(--muted); opacity: .8; pointer-events: none; }
.tab { color: var(--muted); }
.m { cursor: pointer; border-bottom: 2px solid var(--orange); padding-bottom: 1px; }
.m.b { border-bottom-color: var(--blue); }
.m.i { border-bottom-style: dotted; }
.m:hover, .m.on { color: var(--orange); }
.m.b:hover, .m.b.on { color: var(--blue); }
.m.z { display: inline-block; width: .6em; height: 1.2em; vertical-align: text-bottom; }
#pop { position: absolute; z-index: 10; width: min(380px, calc(100vw - 32px)); background: var(--bg); border-left: 2px solid var(--orange); padding: 10px 16px 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .14); }
#pop.b { border-left-color: var(--blue); }
#pop .it + .it { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--hair); }
#pop .lab { font-size: 13px; font-weight: 700; color: var(--orange); }
#pop .lab.b { color: var(--blue); }
#pop .msg { margin: 2px 0 4px; }
#pop .chg { font-size: 13px; color: var(--muted); word-break: break-all; }
#pop .chg code { font-family: var(--font); color: var(--ink); white-space: pre-wrap; }
#pop .row { margin-top: 6px; gap: 0; }
#settings { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--hair); display: grid; gap: 22px; max-width: 640px; }
#settings h2 { font-size: 15px; margin: 0; font-weight: 700; }
.f { display: grid; gap: 4px; }
.f > span:first-child { font-weight: 700; font-size: 14px; }
.f input[type=text], .f input[type=password], .f select { border: 0; border-bottom: 1px solid var(--hair); background: transparent; padding: 4px 0; outline: none; width: 100%; }
.f input:focus, .f select:focus { border-bottom-color: var(--ink); }
.checks { display: grid; gap: 4px; }
.checks label { display: flex; gap: 10px; align-items: baseline; }
.empty { color: var(--muted); padding: 40px 0; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 6px 14px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1 class="brand"><svg class="rt" xmlns="http://www.w3.org/2000/svg" viewBox="-15 -915 13980 1070" style="width:13.980em;height:1.070em;vertical-align:-0.155em" role="img" aria-label="워드봉사 검수기"><path fill="currentColor" stroke="currentColor" stroke-width="30" stroke-linejoin="round" d="M1168 -215C1259 -215 1338 -247 1403 -312C1468 -377 1500 -456 1500 -548C1500 -639 1468 -718 1403 -783C1338 -848 1259 -880 1168 -880H378C286 -880 207 -848 142 -783C77 -718 45 -639 45 -548C45 -456 77 -377 142 -312C207 -247 286 -215 378 -215ZM388 -305C321 -305 263 -329 216 -376C169 -423 145 -481 145 -548C145 -614 169 -672 216 -719C263 -766 321 -790 388 -790H1158C1224 -790 1282 -766 1329 -719C1376 -672 1400 -614 1400 -548C1400 -481 1376 -423 1329 -376C1282 -329 1224 -305 1158 -305ZM45 -50H723V120H823V-50H1500V-140H45ZM1745 120H1845V-880H1745V-425H1575V-335H1745Z M1935 -45H3735V-135H2035V-790H3735V-880H1935ZM1935 120H3735V30H1935Z M3825 -550H5625V-880H5525V-805H3925V-880H3825ZM5495 120C5531 120 5562 107 5587 82C5612 57 5625 26 5625 -10C5625 -46 5612 -77 5587 -102C5562 -127 5531 -140 5495 -140H3955C3919 -140 3888 -127 3863 -102C3838 -77 3825 -46 3825 -10C3825 26 3838 57 3863 82C3888 107 3919 120 3955 120ZM3825 -215H5625V-305H4775V-475H4675V-305H3825ZM3965 30C3954 30 3945 26 3937 18C3929 10 3925 1 3925 -10C3925 -21 3929 -30 3937 -38C3945 -46 3954 -50 3965 -50H5485C5496 -50 5505 -46 5513 -38C5521 -30 5525 -21 5525 -10C5525 1 5521 10 5513 18C5505 26 5496 30 5485 30ZM3925 -640V-715H5525V-640Z M6393 -580 6391 -551 6388 -523 6383 -496 6375 -468 6365 -441 6353 -414 6339 -388 6322 -361 6303 -335 6282 -309 6258 -283 6231 -258 6202 -232 6171 -207 6136 -182 6100 -158 6061 -133 6019 -110 5975 -86 5928 -63 5878 -40 5826 -18 5772 4 5715 26 5750 120 5809 98 5865 75 5919 51 5971 27 6020 3 6067 -22 6112 -48 6154 -74 6194 -100 6231 -128 6266 -155 6299 -184 6329 -213 6357 -243 6382 -274 6405 -305 6425 -337 6443 -369 6460 -337 6480 -305 6503 -274 6528 -243 6556 -213 6586 -184 6619 -155 6654 -128 6691 -100 6731 -74 6773 -48 6818 -22 6865 3 6914 27 6966 51 7020 75 7077 98 7136 120 7170 26 7113 4 7059 -18 7007 -40 6957 -63 6911 -86 6866 -110 6824 -133 6785 -158 6749 -182 6715 -207 6683 -232 6654 -258 6627 -283 6603 -309 6582 -335 6563 -361 6546 -388 6532 -414 6520 -441 6510 -468 6502 -496 6497 -523 6494 -551 6493 -580V-880H6393ZM7245 120H7345V-335H7515V-425H7345V-880H7245Z M8325 120H10125V-260H8325ZM10025 30H8425V-170H10025V30ZM8325 -790H9680V-335H9780V-880H8325ZM10025 -335H10125V-880H10025V-653H9855V-563H10025Z M11065 -681 11064 -667 11061 -654 11056 -640 11048 -626 11037 -611 11024 -596 11006 -580 10986 -563 10962 -547 10935 -530 10905 -513 10871 -497 10834 -480 10794 -464 10750 -448 10704 -432 10654 -416 10600 -401 10544 -386 10485 -371 10422 -356 10356 -341 10287 -327 10215 -313 10233 -215 10307 -229 10377 -244 10444 -258 10508 -273 10569 -289 10627 -305 10683 -321 10735 -337 10784 -354 10830 -371 10873 -388 10914 -406 10951 -425 10985 -444 11017 -463 11046 -483 11072 -504 11095 -526 11115 -548 11135 -526 11158 -504 11184 -483 11213 -463 11245 -444 11279 -425 11317 -406 11357 -388 11400 -371 11446 -354 11495 -337 11548 -321 11603 -305 11661 -289 11722 -273 11786 -258 11853 -244 11923 -229 11997 -215 12015 -313 11943 -327 11874 -341 11808 -356 11745 -371 11686 -386 11630 -401 11576 -416 11527 -432 11480 -448 11436 -464 11396 -480 11359 -497 11325 -513 11295 -530 11268 -547 11244 -563 11224 -580 11207 -596 11193 -611 11182 -626 11174 -640 11169 -654 11166 -667 11165 -681V-880H11065ZM10215 -50H11065V120H11165V-50H12015V-140H10215Z M12105 -790H13630V120H13730V-880H12105ZM13805 120H13905V-880H13805Z"/></svg></h1>
    <div class="row">
      <span class="muted small" id="fileinfo"></span>
      <button class="t dim" id="toggleSettings" aria-expanded="false" aria-controls="settings">설정</button>
    </div>
  </header>

  <section id="edit">
    <label for="src" class="muted small" style="display:none">원고</label>
    <textarea id="src" spellcheck="false" placeholder="원고를 붙여 넣거나 .hwp 파일을 이 화면에 끌어다 놓으면 됨."></textarea>
    <div class="row sepd">
      <button class="t strong" id="run">검사하기</button>
      <label class="t" for="file">파일 열기</label>
      <input id="file" type="file" accept=".hwp,.hwpx,.txt,text/plain" hidden>
      <button class="t dim" id="example">예시 원고</button>
      <button class="t dim" id="clear">비우기</button>
    </div>
  </section>

  <section id="review" hidden>
    <p id="summary"></p>
    <div class="row sepd" id="ractions">
      <button class="t" id="back">고쳐 쓰기</button>
      <button class="t strong" id="fixAll">규칙 위반 한꺼번에 고치기</button>
      <button class="t" id="bareunRun" hidden>바른 맞춤법 검사</button>
      <button class="t" id="claudeRun" hidden>Claude로 맞춤법 보기</button>
      <button class="t" id="copyOut">원고 복사</button>
      <button class="t" id="saveTxt">원고 저장</button>
      <button class="t" id="saveCsv">결과표 저장</button>
      <button class="t dim" id="undo" disabled>되돌리기</button>
    </div>
    <p id="progress" class="muted small"></p>
    <div id="global" class="small"></div>
    <div id="doc"></div>
  </section>

  <section id="settings" hidden aria-label="설정">
    <h2>검사 설정</h2>
    <p class="muted small" style="margin:0">처음 값은 2026 워드 봉사 입력 지침을 따름.</p>
    <label class="f"><span>들여쓰기 칸 수</span><input type="text" id="s-indents"><span class="muted small">문단 2칸, 제목·소제목·목차 4칸. 쉼표로 여러 개, 비우면 검사 안 함.</span></label>
    <label class="f"><span>연속 빈 줄</span>
      <select id="s-blank">
        <option value="3">3줄까지 (보통 1줄, 큰 단원 2줄)</option>
        <option value="2">2줄까지</option>
        <option value="1">1줄까지</option>
        <option value="0">빈 줄 금지</option>
        <option value="-1">검사 안 함</option>
      </select></label>
    <label class="f"><span>쓸 수 있는 기호</span><input type="text" id="s-allowed"><span class="muted small">키보드 기호와 둥근 따옴표. 여기 없는 기호를 표시함.</span></label>
    <label class="f"><span>쪽 번호 줄</span>
      <select id="s-page">
        <option value="off">검사 안 함 (지침은 본문에 쪽 번호를 넣지 않음)</option>
        <option value="dash">-12-</option>
        <option value="angle">&lt;12&gt;</option>
        <option value="bracket">[12]</option>
        <option value="jjok">12쪽</option>
        <option value="custom">직접 정하기 (정규식)</option>
      </select>
      <input type="text" id="s-pagecustom" placeholder="예: ^#(\d+)$" hidden></label>
    <div class="f"><span>더 볼 것</span>
      <div class="checks">
        <label><input type="checkbox" id="s-midBreak"> 문단 중간 줄바꿈</label>
        <label><input type="checkbox" id="s-hanja"> 한자</label>
        <label><input type="checkbox" id="s-math"> 날짜, 연산 기호, 분수</label>
        <label><input type="checkbox" id="s-structure"> 각주 끝, 표 끝, 차례 쪽수, 판권사항</label>
        <label><input type="checkbox" id="s-bookInfo"> 서지사항</label>
        <label><input type="checkbox" id="s-picRef"> '위의 그림' 같은 위치 표현</label>
        <label><input type="checkbox" id="s-spell"> 자주 틀리는 맞춤법</label>
        <label><input type="checkbox" id="s-spacing"> 자주 틀리는 띄어쓰기</label>
        <label><input type="checkbox" id="s-typo"> 오타 의심</label>
        <label><input type="checkbox" id="s-titleMarker"> 제목 표시 @[ @]</label>
      </div>
    </div>
    <label class="f"><span>내 바른 API 키 (선택)</span><input type="password" id="s-bareunKey" placeholder="koba-로 시작" autocomplete="off"><span class="muted small" id="keyNote">공용 한도가 떨어졌을 때만 넣음. 이 브라우저에만 저장됨.</span></label>
    <div class="row"><button class="t dim" id="reset">처음 값으로</button></div>
  </section>
</div>
<div id="pop" hidden role="dialog" aria-label="문제 설명"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>

    const paths = {};

  // ---------- HWP 5 body records ----------
  const PARA_HEADER = 66, PARA_TEXT = 67, PARA_CHAR_SHAPE = 68, CTRL_HEADER = 71, PAGE_DEF = 73;

  function parseSection(data, info) {

  }

  function parseDocInfo(data) {

  function linesFromParas(paras) {
    const out = []; let line = 1;
    for (const p of paras) {
      p.line = line;
      out.push(p.text);

    return out.join("\n");

  async function hwpAnalyze(buf, inflateRaw) {
    const cfb = readCFB(buf);
    const fh = cfb.paths["FileHeader"];
    if (!fh) throw new Error("HWP 파일 헤더가 없음.");
    const fhd = cfb.readStream(fh);
    const props = u32(fhd, 36);
    const compressed = !!(props & 1);
    if (props & 2) throw new Error("암호가 걸린 HWP 파일은 읽을 수 없음. 암호를 풀고 다시 저장해야 함.");
    if (props & 4) throw new Error("배포용 문서는 읽을 수 없음. 일반 문서로 저장해야 함.");

  // 공통 형태로 바꾸기: paras[{line, level, text, align, lsType, ls, indent, marginLeft, runs:[{face,size,bold,italic,underline,strike,outline,shadow,emboss,engrave,sup,sub,ratio}], ctrls:[]}]

        align: ps ? ["JUSTIFY", "LEFT", "RIGHT", "CENTER", "DISTRIBUTE", "DISTRIBUTE_SPACE"][ps.align] || "?" : null,
        lsType: ps ? ["PERCENT", "FIXED", "BETWEEN_LINES", "AT_LEAST"][ps.lsType] || "?" : null,

  }

  async function hwpToText(buf, inflateRaw) { return (await hwpAnalyze(buf, inflateRaw)).text; }

  // ---------- HWPX ----------
  async function unzip(buf, inflateRaw) {
    // Find end of central directory
    let eocd = -1;
    for (let i = buf.length - 22; i >= Math.max(0, buf.length - 70000); i--) {

  const decodeEnt = (s) => s.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'").replace(/&#(\d+);/g, (_, d) => String.fromCharCode(+d))

  function hwpxSection(xml, info) {
    const out = [];
    const re = /<(\/?)hp:(p|run|t|tab|lineBreak|nbSpace|fwSpace|tbl|pic|line|rect|ellipse|arc|polygon|curve|container|textart|ole|equation|header|footer|pagePr)\b([^>]*?)(\/?)>|([^<]+)|<[^>]*>/g;

          if (!close && cur) { const r = +(attr(at, "charPrIDRef") || 0); if (!cur.runs.includes(r)) cur.runs.push(r); }

          else if (tag === "lineBreak") cur.text += "\n";

  }
  function hwpxSectionText(xml) { return hwpxSection(xml, null).map((p) => p.text); }

  function hwpxHeader(xml) {
    const koFaces = {};

        bold: /<hh:bold\b/.test(body), italic: /<hh:italic\b/.test(body),

        outline: !!ol && !/type="NONE"/.test(ol[1]), shadow: !!sh && !/type="NONE"/.test(sh[1]),
        emboss: /<hh:emboss\b/.test(body), engrave: /<hh:engrave\b/.test(body), sup: /<hh:supscript\b/.test(body), sub: /<hh:subscript\b/.test(body),
      };
    }

    for (const m of xml.matchAll(/<hh:paraPr\b([^>]*?)>([\s\S]*?)<\/hh:paraPr>/g)) {

        lsType: ls ? attr(ls[1], "type") : null, ls: ls ? +attr(ls[1], "value") : null,
        indent: ind ? +(attr(ind[1], "value") || 0) : 0, marginLeft: left ? +(attr(left[1], "value") || 0) : 0,

  }

  async function hwpxAnalyze(buf, inflateRaw) {
    const files = await unzip(buf, inflateRaw);
    const secs = Object.keys(files).filter((n) => /^Contents\/section\d+\.xml$/i.test(n))
      .sort((a, b) => +a.match(/(\d+)\.xml$/i)[1] - +b.match(/(\d+)\.xml$/i)[1]);
    if (!secs.length) throw new Error("HWPX 본문을 찾지 못했음.");
    const dec = new TextDecoder("utf-8");
    let head = { charPr: {}, paraPr: {} };
    const hn = Object.keys(files).find((n) => /^Contents\/header\.xml$/i.test(n));
    if (hn) { try { head = hwpxHeader(dec.decode(await files[hn]())); } catch (e) {} }
    const info = { kind: "hwpx", pages: [], paras: [] };
    const raw = [];
    for (const s of secs) raw.push(...hwpxSection(dec.decode(await files[s]()), info));
    const text = linesFromParas(raw);
    for (const p of raw) {
      const pp = head.paraPr[p.paraPr] || {};
      info.paras.push({
        line: p.line, level: p.level, text: p.text, ctrls: p.ctrls,
        align: pp.align || null, lsType: pp.lsType || null, ls: pp.ls ?? null, indent: pp.indent || 0, marginLeft: pp.marginLeft || 0,
        runs: p.runs.map((r) => head.charPr[r]).filter(Boolean),

  }
  async function hwpxToText(buf, inflateRaw) { return (await hwpxAnalyze(buf, inflateRaw)).text; }

  // ---------- 서식 검사 (지침 II-1 기본 입력규칙) ----------
  function formatIssues(info, opts) {
    opts = Object.assign({ font: "휴먼명조", size: 10, ls: 160 }, opts || {});
    const groups = new Map();
    const add = (key, msg, line) => {
      if (!groups.has(key)) groups.set(key, { msg, lines: [] });
      const g = groups.get(key);
      if (line != null && !g.lines.includes(line)) g.lines.push(line);
    };
    for (const pg of info.pages) {
      const w = Math.min(pg.w, pg.h), h = Math.max(pg.w, pg.h);
      if (Math.abs(w - 59528) > 300 || Math.abs(h - 84188) > 300) add("paper", `용지가 A4가 아님(${(pg.w / 7200 * 25.4).toFixed(0)}×${(pg.h / 7200 * 25.4).toFixed(0)}mm). 편집 용지를 A4로 바꿈.`);
      else if (pg.landscape || pg.w > pg.h) add("paper", "용지가 가로 방향임. 세로로 바꿈.");
    }
    const normFont = (f) => f.replace(/\s+/g, "");
    const want = normFont(opts.font || "");
    const ALIGN = { JUSTIFY: "양쪽 정렬", RIGHT: "오른쪽 정렬", CENTER: "가운데 정렬", DISTRIBUTE: "배분 정렬", DISTRIBUTE_SPACE: "나눔 정렬" };
    for (const p of info.paras) {
      const hasText = p.text.replace(/\s/g, "").length > 0;
      const ln = p.line;
      if (hasText) {
        if (p.align && p.align !== "LEFT") add("align:" + p.align, `${ALIGN[p.align] || p.align}인 문단이 있음. 문단 모양에서 왼쪽 정렬로 바꿈.`, ln);
        if (p.lsType && p.lsType !== "PERCENT") add("lstype", `줄 간격 종류가 '글자에 따라'가 아닌 문단이 있음. 글자에 따라 ${opts.ls}%로 맞춤.`, ln);
        else if (p.ls != null && p.ls !== opts.ls) add("ls:" + p.ls, `줄 간격이 ${p.ls}%인 문단이 있음. ${opts.ls}%로 맞춤.`, ln);
        if (p.indent) add("pindent", "문단 모양으로 들여쓰기·내어쓰기를 준 문단이 있음. 문단 모양은 0으로 두고 스페이스로 들여씀.", ln);
        if (p.marginLeft) add("pmargin", "문단 왼쪽 여백을 준 문단이 있음. 문단 모양에서 여백을 0으로 둠.", ln);
        for (const r of p.runs) {
          if (want && r.face && !normFont(r.face).includes(want)) add("font:" + r.face, `글꼴이 ${opts.font}가 아닌 곳이 있음(${r.face}).`, ln);
          if (r.size && Math.abs(r.size - opts.size) > 0.05) add("size:" + r.size, `글자 크기가 ${r.size}pt인 곳이 있음. ${opts.size}pt로 맞춤.`, ln);
          if (r.relSize && r.relSize !== 100) add("rel", "글자 상대 크기를 바꾼 곳이 있음. 100%로 둠.", ln);
          if (r.ratio && r.ratio !== 100) add("ratio", "장평을 바꾼 곳이 있음. 100%로 둠.", ln);
          if (r.bold) add("bold", "진하게 쓴 글자가 있음. 시각 효과는 쓰지 않음.", ln);
          if (r.italic) add("italic", "기울인 글자가 있음. 시각 효과는 쓰지 않음.", ln);
          if (r.underline) add("ul", "밑줄 친 글자가 있음. 시각 효과는 쓰지 않음.", ln);
          if (r.strike) add("strike", "취소선이 있는 글자가 있음.", ln);
          if (r.outline || r.shadow || r.emboss || r.engrave) add("fx", "외곽선·그림자·양각·음각 같은 글자 효과가 있음.", ln);
          if (r.sup || r.sub) add("supsub", "위첨자나 아래첨자를 쓴 곳이 있음. 각주는 ( )로 표시함.", ln);
        }
      }
      for (const c of p.ctrls) {
        if (c === "tbl ") add("tbl", "표가 그대로 들어 있음. 표는 그리지 말고 풀어서 설명함.", ln);
        else if (c === "gso ") add("gso", "그림·선·글상자 같은 개체가 들어 있음. 지우고 글로 설명하거나 '그림 생략'으로 적음.", ln);
        else if (c === "eqed") add("eq", "수식 개체가 있음. 수식은 글자로 입력함(1 + 2 = 3).", ln);
        else if (c === "head" || c === "foot") add("hf", "머리말이나 꼬리말이 있음. 필요 없으면 지움.", ln);
      }
    }
    return [...groups.values()];
  }

  const api = { hwpToText, hwpxToText, hwpxSectionText, hwpAnalyze, hwpxAnalyze, formatIssues };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.HwpRead = api;
})(typeof window !== "undefined" ? window : globalThis);

        continue;
      }

      const isLabel = /^\s*[가-힣A-Za-z ]{1,8}\s?[:：]/.test(L) && i < 40;
      // 탭
      const indentChoices = (indents.length ? indents : [2, 4]).filter((k) => k > 0).map((k) => ({ label: `${k}칸으로`, fix: " ".repeat(k) }));
      const indentHint = indents.includes(2) && indents.includes(4) ? "문단은 2칸, 제목·소제목·목차는 4칸." : `${indents.join(", ")}칸 중 하나로 맞춤.`;
      for (const m of L.matchAll(/\t+/g)) {
        const leadWs = L.match(/^[ \t]*/)[0];
        if (m.index < leadWs.length) {
          if (m.index > 0 && /\t/.test(leadWs.slice(0, m.index))) continue;
          add(ln, 0, leadWs.length, "rule", "탭으로 들여쓰지 말고 스페이스로 들여씀. " + indentHint, null, { kind: "tab", choices: indentChoices, fixStart: 0, fixEnd: leadWs.length });
        } else add(ln, m.index, m.index + m[0].length, "rule", "문장 중간에 탭이 있음.", " ", { kind: "tab" });
      }

      // 들여쓰기
      const lead = L.match(/^[ 　 ]*/)[0];
      const hasTabLead = /^[ ]*\t/.test(L);
      const wasSkip = skipIndent; skipIndent = false;
      if (indents.length && !hasTabLead && !wasSkip) {
        const n = lead.length;
        if (!indents.includes(n) && !(s.titleMarker && L.slice(n).startsWith("@["))) {
          add(ln, 0, Math.max(n, 1), "rule",
            (n === 0 ? "첫머리 들여쓰기가 없음. " : `첫머리가 ${n}칸 들여쓰기임. `) + indentHint,
            null, { kind: "indent", choices: indentChoices, fixStart: 0, fixEnd: n });
        }
      }

      // 줄 끝 공백
      const tm = L.match(/[ 　 ]+$/);
      if (tm) add(ln, tm.index, L.length, "rule", "줄 끝에 공백이 있음.", "", { kind: "trail" });

      // 문장 중간 두 칸 이상 공백
      const body = L.slice(lead.length);
      for (const m of body.matchAll(/(?<=\S) {2,}(?=\S)/g)) {
        const rest = body.slice(m.index + m[0].length);
        if (m[0].length === 2 && /^\d{1,4}(쪽)?$/.test(rest.trim())) continue; // 차례: 제목vv34
        add(ln, lead.length + m.index, lead.length + m.index + m[0].length, "rule",
          "문장 중간에 두 칸 이상 띄웠음. 점자에서는 줄바꿈으로 읽힘.", " ", { kind: "dblspace" });
      }

      // 보이지 않는 문자 / 전각
      for (let k = 0; k < L.length; k++) {
        const ch = L[k], c = ch.charCodeAt(0);
        if (c === 0x200B || c === 0xFEFF || c === 0x200C || c === 0x200D) add(ln, k, k + 1, "rule", "눈에 안 보이는 문자가 있음.", "", { kind: "invis" });
        else if (c === 0x00A0 || c === 0x3000) { if (k >= lead.length && k < L.length - (tm ? tm[0].length : 0)) add(ln, k, k + 1, "rule", "특수 공백(전각 공백 등)임. 일반 공백으로 바꿈.", " ", { kind: "nbsp" }); }
        else if (c >= 0xFF01 && c <= 0xFF5E && c !== 0xFF5E) add(ln, k, k + 1, "rule", "전각 문자임. 반각으로 바꿈.", String.fromCharCode(c - 0xFEE0), { kind: "fullwidth" });
      }

      // 따옴표: 방향 있는 따옴표로 통일
      let quoteFlag = false;
      {
        let dqOpen = false, sqOpen = false;
        const OPENERS = /[\s(\[{<“‘\-—–]/;
        for (let k = 0; k < L.length; k++) {
          const ch = L[k];
          if (!"\"'“”‘’".includes(ch)) continue;
          const prev = k > 0 ? L[k - 1] : "", next = k + 1 < L.length ? L[k + 1] : "";
          const dbl = ch === '"' || ch === "“" || ch === "”";
          if (!dbl && /[A-Za-z]/.test(prev) && /[A-Za-z]/.test(next)) {
            if (ch === "'") add(ln, k, k + 1, "rule", "영어 아포스트로피도 방향 있는 따옴표(’)로 씀.", "’", { kind: "quote" });
            continue;
          }
          let want, byCtx = true;
          const openCtx = (!prev || OPENERS.test(prev)) && next && !/\s/.test(next);
          const closeCtx = prev && !/\s/.test(prev) && (!next || /[\s.,!?;:)\]}…~]/.test(next));
          if (openCtx && !closeCtx) want = "open";
          else if (closeCtx && !openCtx) want = "close";
          else { byCtx = false; want = (dbl ? dqOpen : sqOpen) ? "close" : "open"; }
          if (dbl) dqOpen = want === "open"; else sqOpen = want === "open";
          const right = dbl ? (want === "open" ? "“" : "”") : (want === "open" ? "‘" : "’");
          if (ch === '"' || ch === "'") {
            add(ln, k, k + 1, "rule", `곧은 따옴표(${ch})는 방향 있는 따옴표로 씀. 여기는 ${want === "open" ? "여는" : "닫는"} 따옴표(${right})로 보임.`, right, { kind: "quote" });
          } else if (ch !== right) {
            quoteFlag = true;
            add(ln, k, k + 1, "rule", `따옴표 방향이 반대로 보임. 여기는 ${want === "open" ? "여는" : "닫는"} 따옴표(${right})여야 함.`, right, { kind: "quote", suspect: !byCtx });
          }
        }
      }

      // 기호
      for (let k = 0; k < L.length; k++) {
        const ch = L[k];
        if (ch !== "ㆍ" && /[\p{L}\p{N}\s]/u.test(ch) && !CIRCLED.includes(ch) && !PAREN_NUM.includes(ch) && !CIRCLED_KO.includes(ch) && !/[Ⅰ-ⅿ]/.test(ch) && !"¹²³⁴⁵⁶⁷⁸⁹⁰".includes(ch)) continue;
        if (allowedSet.has(ch) || ch === '"' || ch === "'") continue;
        if ((ch === ">" && L[k - 1] === "-") || (ch === "<" && L[k + 1] === "-")) continue;
        if (s.titleMarker && ((ch === "@" && (L[k + 1] === "[" || L[k + 1] === "]")) || ((ch === "[" || ch === "]") && L[k - 1] === "@"))) continue;
        const cc = ch.charCodeAt(0);
        if (cc >= 0xFF01 && cc <= 0xFF5D) continue; // 전각은 위에서 처리
        let fix = null, msg;
        const ci = CIRCLED.indexOf(ch), pi = PAREN_NUM.indexOf(ch), ki = CIRCLED_KO.indexOf(ch);
        if (ci >= 0) { fix = "(" + (ci + 1) + ")"; msg = "원문자는 (1)처럼 괄호 숫자로 바꿈."; }
        else if (pi >= 0) { fix = "(" + (pi + 1) + ")"; msg = "괄호 숫자 기호는 (1)처럼 풀어 씀."; }
        else if (ki >= 0) { fix = "(" + KO_JAMO_ORDER[ki] + ")"; msg = "원문자는 (가)처럼 괄호로 풀어 씀."; }
        if (ci >= 0 || pi >= 0 || ki >= 0) msg += " 항목 순서는 1. 1) (1) 가. 가) (가)임.";
        else if (/[Ⅰ-ⅿ]/.test(ch)) { msg = "로마 숫자 기호는 영문자(I, II, V…)로 풀어 씀."; }
        else if (SYMMAP.has(ch)) {
          const e = SYMMAP.get(ch); fix = e.rep; msg = e.msg;
          if (fix && allowedSet.size && !/^ ?(->|<-) ?$/.test(fix) && ![...fix.trim()].every((x) => allowedSet.has(x) || /[A-Za-z0-9 ()]/.test(x))) fix = null;
          if (fix === "* ") fix = L[k + 1] === " " ? "*" : "* ";
          if (fix === " -> " || fix === " <- ") {
            // 앞뒤 공백 중복 방지
            const before = L[k - 1] === " ", after = L[k + 1] === " ";
            fix = (before ? "" : " ") + fix.trim() + (after ? "" : " ");
          }
        } else msg = `'${ch}'는 키보드에 없는 기호임. 꼭 필요하면 문자표(Ctrl+F10)로 넣고, 아니면 풀어 씀.`;
        const strict = STRICT_SYMBOLS.includes(ch);
        // 같은 기호가 연달아 있으면 한 번에
        let e = k + 1;
        while (e < L.length && L[e] === ch && ci < 0 && pi < 0 && ki < 0) e++;
        const repl = fix == null ? null : (e - k > 1 && fix.length === 1 ? fix.repeat(e - k) : fix);
        if (ch === "…" && e - k > 1) { add(ln, k, e, "rule", msg, "...", { kind: "sym" }); k = e - 1; continue; }
        add(ln, k, e, strict ? "rule" : "info", msg, repl, { kind: "sym", sym: ch });
        k = e - 1;
      }

      // 마침표 개수
      for (const m of L.matchAll(/(?<!\.)\.{2}(?!\.)|\.{4,}/g)) {
        if (m[0].length === 2 && /\d/.test(L[m.index - 1] || "")) continue;
        add(ln, m.index, m.index + m[0].length, "rule", "말줄임표는 마침표 세 개(...)로 입력함.", "...", { kind: "dots" });
      }

      // 한자
      if (s.hanja) {
        for (const m of L.matchAll(/(\(\s*)?[㐀-䶿一-鿿豈-﫿]+(\s*\))?/g)) {
          const paren = m[1] && m[2];
          const prev = L[m.index - 1] || "";
          if (paren && /[가-힣A-Za-z]/.test(prev)) {
            add(ln, m.index, m.index + m[0].length, "rule", "앞 단어와 겹치는 한자 병기임. 지우거나 도서관 규칙대로 뜻을 풀어 씀.", "", { kind: "hanja" });
          } else {
            add(ln, m.index, m.index + m[0].length, "rule", "한자는 한글 음으로만 적음(東西南北 → 동서남북). 뜻을 밝혀야 하면 ‘바를 정자’처럼 씀.", null, { kind: "hanja" });
          }
        }
      }

      // 문장부호 앞 공백 / 뒤 띄어쓰기
      for (const m of L.matchAll(/(?<=[가-힣A-Za-z0-9)"'”’]) +(?=[.,?!;:](?!\.\.))/g)) {
        if (/\d/.test(L[m.index - 1]) && L[m.index + m[0].length] === ":") continue;
        if (L.slice(m.index + m[0].length, m.index + m[0].length + 3) === "...") continue;
        add(ln, m.index, m.index + m[0].length, "rule", "문장부호 앞에는 띄우지 않음.", "", { kind: "prepunct" });
      }
      for (const m of L.matchAll(/(?<=[가-힣] ?)[,.?!](?=[가-힣A-Za-z])|(?<=[A-Za-z0-9])[,?!;](?=[가-힣])/g)) {
        add(ln, m.index, m.index + 1, "rule", "문장부호 뒤에는 한 칸 띄움.", m[0] + " ", { kind: "postpunct" });
      }

      // 쌍점·쌍반점 뒤 띄우기 (숫자:숫자는 붙임)
      for (const m of L.matchAll(/(?<=[가-힣A-Za-z)\]"'”’])[:;](?=[^\s\d:;\/])|(?<=[가-힣)])[:;](?=\d)/g)) {
        add(ln, m.index, m.index + 1, "rule", "쌍점(:)과 쌍반점(;)은 앞말에 붙이고 뒤는 한 칸 띄움(날짜: 2025년). 비율, 시간, 성경 구절(3:3)만 붙여 씀.", m[0] + " ", { kind: "colon" });
      }
      for (const m of L.matchAll(/(?<=\d) +: *(?=\d)|(?<=\d): +(?=\d)/g)) {
        add(ln, m.index, m.index + m[0].length, "rule", "숫자 사이 쌍점(비율, 시간, 성경 구절)은 붙여 씀(3:3).", ":", { kind: "colon" });
      }
      // 물결표·빗금은 붙여 쓰기
      for (const m of L.matchAll(/(?<=\S) +~ *(?=\S)|(?<=\S)~ +(?=\S)/g)) {
        add(ln, m.index, m.index + m[0].length, "rule", "물결표(~)는 앞뒤를 붙여 씀(30:11~30:13).", "~", { kind: "tilde" });
      }
      for (const m of L.matchAll(/(?<=\S) +\/ *(?=\S)|(?<=\S)\/ +(?=\S)/g)) {
        add(ln, m.index, m.index + m[0].length, "rule", "빗금(/)은 붙여 씀(영수/철수).", "/", { kind: "slash" });
      }
      // 말줄임표 앞뒤 붙이기 (원본 우선이라 의심으로)
      for (const m of L.matchAll(/(?<=[가-힣A-Za-z]) +(?=\.\.\.)|(?<=[^.]\.\.\.) +(?=[가-힣A-Za-z])/g)) {
        add(ln, m.index, m.index + m[0].length, "rule", "말줄임표는 앞뒤를 붙여 씀(하지만...사랑하려니). 원본 책이 띄어 썼으면 그대로 둠.", "", { kind: "ellipsis", suspect: true });
      }

      // 숫자·수식
      if (s.math) {
        for (const m of L.matchAll(/(?<![\d.])((?:19|20)\d{2})\. ?(\d{1,2})\. ?(\d{1,2})\.?(?!\d)/g)) {
          add(ln, m.index, m.index + m[0].length, "rule", "날짜는 글자로 풀어 씀(2018. 1. 1. → 2018년 1월 1일).",
            `${m[1]}년 ${+m[2]}월 ${+m[3]}일`, { kind: "date" });
        }
        for (const m of L.matchAll(/(?<=[0-9A-Za-z가-힣)]) *[+=] *(?=[0-9A-Za-z가-힣(])/g)) {
          if (m[0].startsWith(" ") && m[0].endsWith(" ")) continue;
          const op = m[0].trim();
          add(ln, m.index, m.index + m[0].length, "rule", "사칙연산 기호와, 한글·영어를 잇는 기호는 앞뒤를 띄움(1 + 2 = 3, have + 과거분사).", ` ${op} `, { kind: "op" });
        }
        for (const m of L.matchAll(/(?<=\d) *\* *(?=\d)/g)) {
          if (m[0] === " * ") continue;
          add(ln, m.index, m.index + m[0].length, "rule", "곱셈 기호(*)는 앞뒤를 띄움(5 * 4 = 20).", " * ", { kind: "op" });
        }
        for (const m of L.matchAll(/(?<![\d\/.:])(\d{1,3})\/(\d{1,3})(?![\d\/])/g)) {
          add(ln, m.index, m.index + m[0].length, "typo", "분수라면 읽는 순서대로 분모를 먼저 씀(1/2 → 2/1). 분수가 아니면 그대로 둠.", `${m[2]}/${m[1]}`, { kind: "frac", suspect: true });
        }
      }

      // 표 제목: 표 - 13
      if (s.structure) {
        const tt = L.match(/^(\s*)표 ?[-–—]? ?(\d+)/);
        if (tt && !/^\s*표 - \d/.test(L)) add(ln, tt[1].length, tt[0].length, "rule", "표 제목은 '표 - 13'처럼 하이픈 앞뒤를 띄움.", `표 - ${tt[2]}`, { kind: "tabletitle" });
      }

      // 괄호 짝
      const Lp = L.replace(/^\s*(\d{1,3}|[가-하])\)/, "");
      const cnt = (re) => (Lp.match(re) || []).length;
      const pairs = [["(", ")", /\(/g, /\)/g], ["[", "]", /\[/g, /\]/g]];
      for (const [o, c, ro, rc] of pairs) {
        const a = cnt(ro), b = cnt(rc);
        if (a !== b) {
          const off = L.length - Lp.length;
          const at = off + (a > b ? Lp.lastIndexOf(o) : Lp.indexOf(c));
          add(ln, at, at + 1, "typo", `괄호 짝이 안 맞음('${o}' ${a}개, '${c}' ${b}개).`, null, { kind: "pair" });
        }
      }
      const lq = cnt(/[“]/g) + 0, rq = cnt(/[”]/g), sq = cnt(/"/g);
      if (!quoteFlag && sq === 0 && lq !== rq) { const at = Math.max(L.lastIndexOf("“"), L.lastIndexOf("”")); add(ln, at, at + 1, "typo", "여는 따옴표와 닫는 따옴표 개수가 다름.", null, { kind: "pair" }); }

      // 제목 표시
      if (s.titleMarker) {
        const a = cnt(/@\[/g), b = cnt(/@\]/g);
        if (a !== b) add(ln, 0, L.length, "rule", `제목 표시 @[ @] 짝이 안 맞음(@[ ${a}개, @] ${b}개).`, null, { kind: "title" });
      }

      // 그림 위치 표현
      if (s.picRef) {
        for (const m of L.matchAll(/(위의?|아래의?|오른쪽의?|왼쪽의?|옆의?) ?(그림|사진|표|도표|그래프|삽화)/g)) {
          add(ln, m.index, m.index + m[0].length, "rule", "점자책에서는 위치가 달라짐. '앞의', '다음'처럼 바꿈.", null, { kind: "picref" });
        }
      }

      // 맞춤법·띄어쓰기
      const lists = [];
      if (s.spell) lists.push(...SPELL);
      if (s.spacing) lists.push(...SPACING);
      for (const r of lists) {
        r.re.lastIndex = 0;
        for (const m of L.matchAll(r.re)) {
          const rep = r.rep.replace(/\$(\d)/g, (_, d) => m[+d] ?? "");
          if (rep === m[0]) continue;
          add(ln, m.index, m.index + m[0].length, r.cat, r.msg, rep, { kind: r.cat, suspect: true });
        }
      }

      // 오타 의심
      if (s.typo) {
        for (const m of L.matchAll(/[\u3131-\u318C]+/g)) {
          add(ln, m.index, m.index + m[0].length, "typo", "자음이나 모음만 따로 있음. 오타인지 확인 필요.", null, { kind: "jamo" });
        }
        for (const m of L.matchAll(/(?<![가-힣A-Za-z0-9])([가-힣]{1,6})( +)\1(?![가-힣])/g)) {
          add(ln, m.index, m.index + m[0].length, "typo", `'${m[1]}'이(가) 두 번 이어짐. 실수로 두 번 친 건지 확인 필요.`, m[1], { kind: "repeat", suspect: true });
        }
        for (const m of L.matchAll(/[가-힣][a-z]{1,2}(?=[가-힣])|(?<=[가-힣])[a-z]{1,2}[가-힣]/g)) {
          add(ln, m.index, m.index + m[0].length, "typo", "한글 사이에 영문자가 끼어 있음. 한/영 전환 실수인지 확인 필요.", null, { kind: "hanen" });
        }
      }

      // 문단 중간 줄바꿈
      if (s.midBreak && !isLabel && indents.length && !indents.includes(0) && i + 1 < lines.length) {
        const nx = lines[i + 1];
        if (!isBlank(nx) && !/^[ \t　]/.test(nx) && !ENDERS.test(L.trimEnd()) && !(pageRe && pageRe.test(nx))
          && /[가-힣A-Za-z0-9,]$/.test(L.trimEnd())) {
          add(ln, L.trimEnd().length - 1, L.trimEnd().length, "rule",
            "문장이 끝나지 않았는데 줄이 바뀜. 책의 줄 끝마다 엔터를 치지 말고 문단이 끝날 때만 침.",
            null, { kind: "midbreak", joinNext: true });
          skipIndent = true;
        }
      }
    }

    // 쪽 번호 흐름
    for (let k = 1; k < pages.length; k++) {
      const a = pages[k - 1], b = pages[k];
      if (b.n === a.n) add(b.ln, 0, lines[b.ln - 1].length, "rule", `쪽 번호 ${b.n}이 두 번 나옴(${a.ln}번째 줄에도 있음).`, null, { kind: "pageseq" });
      else if (b.n < a.n) add(b.ln, 0, lines[b.ln - 1].length, "rule", `쪽 번호가 ${a.n}에서 ${b.n}로 거꾸로 감.`, null, { kind: "pageseq" });
      else if (b.n > a.n + 1) {
        const miss = b.n - a.n - 1;
        add(b.ln, 0, lines[b.ln - 1].length, "rule",
          miss === 1 ? `${a.n + 1}쪽이 빠졌음(${a.n}쪽 다음이 ${b.n}쪽). 빈 쪽이나 그림 쪽이 아닌지 확인 필요.`
            : `${a.n + 1}–${b.n - 1}쪽(${miss}쪽)이 빠졌음. 빈 쪽이나 그림 쪽이 아닌지 확인 필요.`, null, { kind: "pageseq" });
      }
    }

    // 서지사항 (지침 6-가: vvvv도서명 / vv저자: / vv역자: / vv출판사: / vv출판일: / vv입력봉사자:)
    if (s.bookInfo && lines.some((l) => l.trim())) {
      const headIdx = [];
      for (let i = 0; i < lines.length && headIdx.length < 12; i++) if (lines[i].trim()) headIdx.push(i);
      const head = headIdx.map((i) => lines[i]);
      const need = [["저자", /^\s*(저자|지은이)\s*:/], ["출판사", /^\s*출판사\s*:/], ["출판일", /^\s*출판일\s*:/], ["입력봉사자", /^\s*입력\s?봉사자\s*:/]];
      const missing = need.filter(([, re]) => !head.some((l) => re.test(l))).map(([n]) => n);
      if (missing.length) add(headIdx[0] + 1, 0, 0, "info", `맨 앞 서지사항에 ${missing.map((m) => "'" + m + ":'").join(", ")} 줄이 안 보임. 도서명(4칸) 다음 줄부터 2칸 들여 저자:, 역자:, 출판사:, 출판일:, 입력봉사자:를 적음.`, null, { kind: "bookinfo" });
      const first = lines[headIdx[0]];
      if (!/^ {4}\S/.test(first) && !/:/.test(first)) add(headIdx[0] + 1, 0, 0, "info", "첫 줄의 도서명은 4칸 들여씀.", null, { kind: "bookinfo" });
      for (const i of headIdx) {
        const L = lines[i];
        if (/^\s*(저자|역자|출판사|출판일|입력\s?봉사자)\s*:/.test(L) && !/^ {2}\S/.test(L)) add(i + 1, 0, 0, "info", "서지사항 항목은 2칸 들여씀(vv저자: 박재완).", null, { kind: "bookinfo" });
      }
    }

    if (s.structure) {
      // 각주: '각주1:' 설명 문단 뒤에는 '각주 끝'

        let ok = false;
        for (let j = i; j < Math.min(lines.length, i + 15); j++) {
          if (j > i && !lines[j].trim()) break;
          if (/각주\s?끝/.test(lines[j])) { ok = true; break; }
        }
        if (!ok) add(i + 1, 0, lines[i].length, "rule", "각주 설명이 끝나는 곳에 '각주 끝.'을 적음.", null, { kind: "footnote" });
        while (i + 1 < lines.length && /^\s*각주\s?\d*\s?[:：]/.test(lines[i + 1])) i++;
      }
      // 표: '표 - 13 ...' 다음에는 '표 끝'
      const tableIdx = [];
      for (let i = 0; i < lines.length; i++) if (/^\s*표 ?[-–—]? ?\d+/.test(lines[i])) tableIdx.push(i);
      for (let t = 0; t < tableIdx.length; t++) {
        const st = tableIdx[t], en = t + 1 < tableIdx.length ? tableIdx[t + 1] : Math.min(lines.length, st + 200);
        let ok = false;
        for (let j = st; j < en; j++) if (/표\s?끝/.test(lines[j])) { ok = true; break; }
        if (!ok) add(st + 1, 0, lines[st].length, "rule", "풀어 쓴 표의 마지막에 '표 끝.'을 적음.", null, { kind: "tableend" });
      }
      // 차례: 쪽수 필수
      const tocAt = lines.findIndex((l, i) => i < 400 && /^\s*(차례|목차)\s*$/.test(l));
      if (tocAt >= 0) {
        let blankRun2 = 0;
        for (let j = tocAt + 1; j < lines.length && j < tocAt + 300; j++) {
          const L = lines[j];
          if (!L.trim()) { if (++blankRun2 >= 2) break; continue; }
          blankRun2 = 0;
          if (/^ {4}\S/.test(L) && j > tocAt + 1) break; // 본문 제목(4칸)이 나오면 차례 끝으로 봄
          if (!/\d{1,4}(쪽)?\s*$/.test(L)) add(j + 1, 0, L.length, "rule", "차례에는 쪽수를 꼭 적음(vv제4부 절 속의 문화읽기vv34).", null, { kind: "toc" });
          else if (!/\S {2}\d{1,4}(쪽)?\s*$/.test(L)) add(j + 1, 0, L.length, "rule", "차례의 쪽수 앞은 2칸 띄움(vv해설vv40).", null, { kind: "toc" });
        }
      }
      // 판권사항
      if (lines.length > 150 && !lines.some((l) => /^\s*판권\s?사항\s*$/.test(l))) {
        add(lines.length, 0, 0, "info", "판권사항이 안 보임. 책 맨 끝에 'vvvv판권사항'을 쓰고 도서명, 초판일, 저자, 출판사, 주소, ISBN, 가격을 적음.", null, { kind: "colophon" });
      }
    }

    return { lines, issues, pages };
  }

  // 자동 수정: fix가 있는 이슈(겹치지 않는 것만) + 빈 줄 삭제 + 줄 합치기는 선택적
  function applyFixes(lines, issues, opts) {
    opts = opts || {};
    const byLine = new Map();
    for (const it of issues) {
      if (!byLine.has(it.line)) byLine.set(it.line, []);
      byLine.get(it.line).push(it);
    }
    const out = lines.slice();
    const delLines = new Set();
    let applied = 0;

      let L = out[ln - 1];
      list.sort((a, b) => b.start - a.start || b.end - a.end);
      let lastStart = Infinity;
      for (const it of list) {

        if (it.insertAt0 != null) { if (lastStart > 0) { L = it.insertAt0 + L; applied++; lastStart = 0; } continue; }
        if (it.fix == null) continue;
        if (it.end > lastStart) continue;
        L = L.slice(0, it.start) + it.fix + L.slice(it.end);
        lastStart = it.start; applied++;
      }
      out[ln - 1] = L;
    }

  }

  // 한 이슈만 고치기 (줄 합치기 포함)
  function fixOne(lines, it, choice) {
    const out = lines.slice();
    const i = it.line - 1;

    } else if (it.delLine) out.splice(i, 1);
    else if (it.insertAt0 != null) out[i] = it.insertAt0 + out[i];
    else if (it.fix != null) out[i] = out[i].slice(0, it.start) + it.fix + out[i].slice(it.end);
    return out.join("\n");
  }

  function isFixable(it) { return it.fix != null || it.delLine || it.insertAt0 != null || it.joinNext || !!(it.choices && it.choices.length); }

  const api = { check, applyFixes, fixOne, isFixable, DEFAULTS, CAT, splitLines };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.WordCheck = api;
})(typeof window !== "undefined" ? window : globalThis);

  const visible = () => result.issues.filter((i) => !ignored.has(keyOf(i)) && !i.quiet);

  // ---------- 그리기 ----------
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function ws(s, pos, lead, trail) {

    if (info) parts.push(`<span class="i">${RT.info} ${info.toLocaleString()}곳</span>`);
    $("summary").innerHTML = parts.length
      ? `${result.lines.length.toLocaleString()}줄에서 ${parts.join(", ")}을 찾았음. 밑줄에 마우스를 올리면 설명이 나옴.`
      : `${result.lines.length.toLocaleString()}줄을 봤는데 고칠 곳이 없음.`;
    // 서식
    const g = $("global"); g.innerHTML = "";
    for (const it of fmtItems) {
      const d = document.createElement("div"); d.className = "g";
      d.innerHTML = `<span class="gl">${RT.fmt}</span>` + esc(it.msg) + (it.lines.length ? ` <span class="muted">${it.lines.slice(0, 6).map((l) => `<button class="t dim" data-line="${l}">${l}</button>`).join(" ")}${it.lines.length > 6 ? ` 외 ${it.lines.length - 6}곳` : ""}번째 줄</span>` : "");
      g.appendChild(d);
    }
    // 원고
    const byLine = new Map();
    for (const it of vis) { if (!byLine.has(it.line)) byLine.set(it.line, []); byLine.get(it.line).push(it); }
    const rows = [];
    for (let i = 0; i < result.lines.length; i++) {
      const ln = i + 1;
      rows.push(`<div class="ln" id="L${ln}"><span class="no">${ln}</span><span class="tx">${renderLine(result.lines[i], byLine.get(ln) || [])}</span></div>`);
    }
    $("doc").innerHTML = rows.join("");
    const fixable = vis.filter((i) => i.cat === "rule" && C.isFixable(i) && !i.joinNext && !i.suspect && !i.choices).length;
    $("fixAll").disabled = !fixable;
    $("fixAll").textContent = fixable ? `규칙 위반 ${fixable.toLocaleString()}곳 한꺼번에 고치기` : "한꺼번에 고칠 규칙 위반 없음";
    updateButtons();
  }
  $("global").addEventListener("click", (e) => {
    const l = e.target.dataset.line; if (!l) return;
    if ($("src").value !== fmtText) toast("파일을 연 뒤 원고가 바뀌어서 줄 위치가 다를 수 있음.");
    jump(+l);
  });
  function jump(ln) {
    const row = $("L" + ln); if (!row) return;
    row.scrollIntoView({ block: "center" });
    document.querySelectorAll(".ln.flash").forEach((x) => x.classList.remove("flash"));
    row.classList.add("flash");
  }

  // ---------- 설명 창 ----------
  const pop = $("pop");
  let popFor = null, pinned = false, hideTimer = null;
  function showPop(el, pin) {
    clearTimeout(hideTimer);
    const list = segIssues[+el.dataset.s] || [];
    if (!list.length) return;
    if (popFor && popFor !== el) popFor.classList.remove("on");
    popFor = el; el.classList.add("on");
    if (pin) pinned = true;
    const blue = list.every((i) => BLUE.has(i.cat));
    pop.className = blue ? "b" : "";
    const show = (s) => s.replace(/ /g, "·").replace(/\t/g, "→");
    pop.innerHTML = list.map((it, k) => {
      const L = result.lines[it.line - 1] || "";
      const piece = L.slice(it.start, it.end);
      let chg = "";
      if (it.joinNext) chg = "다음 줄을 이 줄 뒤에 붙임.";
      else if (it.delLine) chg = "이 빈 줄을 지움.";
      else if (it.insertAt0) chg = `앞에 <code>${esc(show(it.insertAt0))}</code>를 넣음.`;
      else if (it.fix != null && piece) chg = `<code>${esc(show(piece))}</code> → <code>${it.fix === "" ? "(지움)" : esc(show(it.fix))}</code>`;
      const lab = (it.ext ? esc(`${it.ext === "바른" ? "바른이" : it.ext + "가"} 찾은 `) : "") + RT[it.cat];
      return `<div class="it" data-k="${k}"><div class="lab${BLUE.has(it.cat) ? " b" : ""}">${lab}</div><div class="msg">${esc(it.msg)}</div>${chg ? `<div class="chg">${chg}</div>` : ""}<div class="row sepd">${it.choices && it.choices.length ? it.choices.map((c, ci) => `<button class="t strong" data-act="choice" data-c="${ci}">${esc(c.label)}</button>`).join("") : (C.isFixable(it) ? '<button class="t strong" data-act="fix">고치기</button>' : "")}<button class="t dim" data-act="ign">무시</button></div></div>`;
    }).join("");
    pop.hidden = false;
    const r = el.getBoundingClientRect();
    const w = pop.offsetWidth;
    let left = r.left + window.scrollX;
    left = Math.max(16 + window.scrollX, Math.min(left, window.scrollX + document.documentElement.clientWidth - w - 16));
    let top = r.bottom + window.scrollY + 8;
    if (r.bottom + pop.offsetHeight + 16 > window.innerHeight && r.top > pop.offsetHeight + 16) top = r.top + window.scrollY - pop.offsetHeight - 8;
    pop.style.left = left + "px"; pop.style.top = top + "px";
  }
  function hidePop(force) {
    if (pinned && !force) return;
    pinned = false; pop.hidden = true;
    if (popFor) popFor.classList.remove("on");
    popFor = null;
  }
  const doc = $("doc");
  doc.addEventListener("mouseover", (e) => { const m = e.target.closest(".m"); if (m && !pinned) showPop(m, false); });
  doc.addEventListener("mouseout", (e) => { const m = e.target.closest(".m"); if (m && !pinned) { clearTimeout(hideTimer); hideTimer = setTimeout(() => hidePop(false), 300); } });
  doc.addEventListener("click", (e) => { const m = e.target.closest(".m"); if (m) { pinned = false; showPop(m, true); e.stopPropagation(); } });
  doc.addEventListener("keydown", (e) => { const m = e.target.closest(".m"); if (m && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pinned = false; showPop(m, true); pop.querySelector("button")?.focus(); } });
  pop.addEventListener("mouseenter", () => clearTimeout(hideTimer));
  pop.addEventListener("mouseleave", () => { if (!pinned) hideTimer = setTimeout(() => hidePop(false), 300); });
  document.addEventListener("click", (e) => { if (!pop.hidden && !pop.contains(e.target) && !e.target.closest(".m")) hidePop(true); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !pop.hidden) { const f = popFor; hidePop(true); f?.focus(); } });
  pop.addEventListener("click", (e) => {
    const act = e.target.dataset.act; if (!act || !popFor) return;
    const list = segIssues[+popFor.dataset.s] || [];
    const it = list[+e.target.closest(".it").dataset.k];
    if (!it) return;
    const y = window.scrollY;
    if (act === "fix" || act === "choice") {
      pushHistory();
      $("src").value = act === "choice" ? C.fixOne(result.lines, it, it.choices[+e.target.dataset.c].fix) : C.fixOne(result.lines, it);
      if (it.ext) extFindings = extFindings.filter((f) => !(f.line === it.line && f.col === it.start));
      run(); toast("고쳤음.");
    } else { ignored.add(keyOf(it)); render(); }
    window.scrollTo(0, y);
  });

  // ---------- 고치기, 내보내기 ----------
  function pushHistory() { history.push($("src").value); if (history.length > 30) history.shift(); $("undo").disabled = false; }
  $("undo").onclick = () => { if (!history.length) return; $("src").value = history.pop(); $("undo").disabled = !history.length; run(); toast("되돌렸음."); };
  $("fixAll").onclick = () => {
    const targets = result.issues.filter((i) => i.cat === "rule" && C.isFixable(i) && !i.joinNext && !i.suspect && !i.choices && !ignored.has(keyOf(i)));
    if (!targets.length) return;
    pushHistory();
    const r = C.applyFixes(result.lines, targets);
    $("src").value = r.text;
    run();
    const left = visible().filter((i) => i.choices).length;
    toast(`${r.applied.toLocaleString()}곳을 고쳤음.` + (left ? ` 들여쓰기 ${left.toLocaleString()}곳은 2칸, 4칸 중 하나씩 골라야 함.` : ""));
  };
  $("copyOut").onclick = async () => {
    try { await navigator.clipboard.writeText($("src").value); toast("복사했음. 한글 문서에 붙여 넣으면 됨."); }
    catch (e) { setMode("edit"); $("src").select(); toast("자동 복사가 막혔음. Ctrl+C로 복사함."); }
  };
  let downloads = null;
  async function saveFile(filename, text, type) {
    const blob = new Blob(["﻿" + text], { type: (type || "text/plain") + ";charset=utf-8" });
    if (downloads) { try { await downloads.save({ filename, data: blob }); } catch (e) { toast("저장하지 않았음."); } return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function csvField(s) { s = String(s ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  $("saveTxt").onclick = () => saveFile("입력원고_검수본.txt", $("src").value);
  $("saveCsv").onclick = () => {
    const rows = [["줄", "분류", "해당 부분", "제안", "설명"]];
    for (const it of fmtItems) rows.push([it.lines.join(" "), "서식", "", "", it.msg]);
    for (const it of visible()) {
      const L = result.lines[it.line - 1] || "";
      rows.push([it.line, LABEL[it.cat] + (it.ext ? `(${it.ext})` : ""), L.slice(it.start, it.end), it.fix == null ? "" : (it.fix === "" ? "(지움)" : it.fix), it.msg]);
    }
    saveFile("검수결과표.csv", rows.map((r) => r.map(csvField).join(",")).join("\r\n"), "text/csv");
  };

  // ---------- 바깥 맞춤법 검사 공통 ----------
  let extCtl = null;
  function chunks() {
    const out = []; let cur = [], size = 0;
    for (let i = 0; i < result.lines.length; i++) {
      const L = result.lines[i];
      if (!L.trim()) continue;
      if (size + L.length > 3000 && cur.length) { out.push(cur); cur = []; size = 0; }
      cur.push({ ln: i + 1, text: L }); size += L.length + 1;
    }
    if (cur.length) out.push(cur);
    return out;
  }
  function addFinding(f) {
    if (!f.wrong || f.wrong === f.right) return false;
    if (extFindings.some((x) => x.line === f.line && x.col === f.col && x.wrong === f.wrong)) return false;
    extFindings.push(f); return true;
  }
  function progress(html) { $("progress").innerHTML = html; }
  async function runExternal(name, perChunk) {
    if (extCtl) return;
    const parts = chunks();
    if (!parts.length) return;
    extCtl = new AbortController();
    const words = result.lines.join(" ").split(/\s+/).filter(Boolean).length;
    let found = 0, done = 0;
    updateButtons();
    try {
      for (const part of parts) {
        if (extCtl.signal.aborted) break;
        progress(`${esc(name)} 검사 중임. ${done + 1} / ${parts.length}묶음 (${part[0].ln}–${part[part.length - 1].ln}번째 줄) <button class="t" id="extStop">멈추기</button>`);
        $("extStop").onclick = () => extCtl?.abort();
        found += await perChunk(part, extCtl.signal);
        done++;
        run();
      }
      progress(extCtl.signal.aborted ? `${esc(name)} 검사를 멈췄음. ${found}곳을 찾았음.` : `${esc(name)} 검사를 마쳤음. ${found}곳을 더 찾았음.` + (name === "바른" ? ` 약 ${words.toLocaleString()}어절을 썼음.` : ""));
    } catch (e) {
      const at = parts[done]?.[0]?.ln;
      progress(esc(e.userMsg || (e.code === "cancelled" ? "멈췄음." : `중간에 멈췄음. ${at ? at + "번째 줄부터 " : ""}다시 하면 됨.`)) + (found ? ` 그 전까지 ${found}곳을 찾았음.` : ""));
    } finally { extCtl = null; updateButtons(); run(); }
  }

  // ---------- 바른 ----------
  function bareunTarget() {
    const key = (store.get("wc-bareun-key") || "").trim();
    if (key) return { url: BAREUN_DIRECT, key };
    if (BAREUN_PROXY && !BAREUN_PROXY.startsWith("/*")) return { url: BAREUN_PROXY, key: null };
    return null;
  }
  const BAREUN_CAT = { SPACING: "띄어쓰기", TYPO: "오타" };
  async function bareunChunk(part, signal) {
    const tgt = bareunTarget();
    const content = part.map((p) => p.text).join("\n");
    const starts = []; let o = 0; for (const p of part) { starts.push(o); o += p.text.length + 1; }
    const body = tgt.key
      ? { document: { content, language: "ko-KR" }, encoding_type: "UTF16" }
      : { text: content };
    const headers = { "Content-Type": "application/json" };
    if (tgt.key) headers["api-key"] = tgt.key;
    let res;
    try { res = await fetch(tgt.url, { method: "POST", headers, body: JSON.stringify(body), signal }); }
    catch (e) { if (signal.aborted) throw { code: "cancelled" }; throw { userMsg: "바른 서버에 연결하지 못했음. 인터넷 연결이나 프록시 주소를 확인 필요." }; }
    if (!res.ok) {
      let detail = ""; try { detail = (await res.text()).slice(0, 200); } catch (e) {}
      const msg = res.status === 401 || res.status === 403 ? (tgt.key ? "바른 키가 맞지 않음. 설정에서 키를 확인 필요." : "이 주소에서는 공용 바른 검사를 쓸 수 없음.")
        : res.status === 429 || /quota|limit|한도/i.test(detail) ? "바른 사용 한도에 걸렸음. 잠시 뒤에 하거나, 설정에 내 바른 키를 넣음."
        : res.status === 413 ? "한 번에 보내는 글이 너무 김." : `바른 검사가 실패했음(${res.status}).`;
      throw { userMsg: msg };
    }
    const data = await res.json();
    const blocks = data.revised_blocks || data.revisedBlocks || [];
    const helps = data.helps || {};
    let n = 0;
    for (const b of blocks) {
      const og = b.origin || {};
      let off = Number(og.begin_offset ?? og.beginOffset ?? -1), len = Number(og.length ?? 0);
      let wrong = og.content ?? "";
      if (!wrong && off >= 0) wrong = content.substr(off, len);
      if (off < 0 || content.substr(off, wrong.length) !== wrong) off = content.indexOf(wrong);
      if (off < 0 || !wrong) continue;
      const rv = (b.revisions && b.revisions[0]) || {};
      const right = rv.revised ?? b.revised ?? "";
      if (!right || right === wrong) continue;
      if (wrong.includes("\n") || right.includes("\n")) continue;
      // 지침과 부딪히는 공백 교정(문장부호 주변, 들여쓰기)은 건너뜀
      if (wrong.replace(/\s/g, "") === right.replace(/\s/g, "") && /[^\p{L}\p{N}\s]/u.test(wrong + right)) continue;
      if (wrong.trim() === right.trim()) continue;
      let li = 0; while (li + 1 < starts.length && starts[li + 1] <= off) li++;
      const col = off - starts[li];
      const help = helps[rv.help_id ?? rv.helpId] || {};
      const cat = String(rv.category || "");
      if (addFinding({ line: part[li].ln, col, lineText: part[li].text, wrong, right, type: BAREUN_CAT[cat] || "맞춤법", reason: help.comment || (cat === "SPACING" ? "띄어쓰기를 고칠 곳으로 보임." : "맞춤법을 고칠 곳으로 보임."), src: "바른" })) n++;
    }
    return n;
  }
  $("bareunRun").onclick = () => {
    if (!bareunTarget()) { toast("설정에 바른 키를 넣거나 프록시 주소를 정해야 함."); return; }
    runExternal("바른", bareunChunk);
  };

  // ---------- Claude (claude.ai에서 열었을 때만) ----------
  let sample = null;
  const PROMPT = `너는 한국어 교정 전문가야. 아래 원고는 시각장애인용 점자책을 만들려고 봉사자가 출판된 책을 보고 그대로 타이핑한 거야. 원본 책은 없어.
타이핑하면서 생긴 것으로 보이는 맞춤법·띄어쓰기 실수와 오타만 찾아.
- 작가가 일부러 쓴 표현(사투리, 구어체, 인물의 말투, 의성어·의태어, 옛말, 시적 표현, 고유명사, 외래어)은 건드리지 마.
- 문장 다듬기, 어순, 문체는 고치지 마.
- 문장부호, 따옴표 모양, 들여쓰기, 공백 개수, 특수문자, 한자는 무시해.
- 확실한 것만 적어.
- 각 줄 앞의 [숫자]는 줄 번호야.
출력은 JSON 배열 하나만: [{"line": 줄 번호, "wrong": "원고에 적힌 그대로의 틀린 부분(앞뒤 한두 글자 포함)", "right": "고친 형태", "type": "맞춤법"|"띄어쓰기"|"오타", "reason": "짧은 이유, 음체(~음, ~함으로 끝맺음)"}]. 없으면 [].

원고:
`;
  async function claudeChunk(part, signal) {
    let data;
    try { data = await sample.json(PROMPT + part.map((p) => `[${p.ln}] ${p.text}`).join("\n"), { signal }); }
    catch (e) {
      if (e.code === "invalid_json") return 0;
      if (e.code === "not_granted" || e.code === "sampling_disabled") { $("claudeRun").hidden = true; throw { userMsg: "Claude 사용이 허락되지 않았음." }; }
      if (e.code === "rate_limited") throw { userMsg: "Claude 사용 한도에 걸렸음. 잠시 뒤에 다시 하면 됨." };
      throw e;
    }
    let n = 0;
    const valid = new Map(part.map((p) => [p.ln, p.text]));
    if (Array.isArray(data)) for (const d of data) {
      const ln = Number(d?.line), wrong = String(d?.wrong ?? ""), L = valid.get(ln);
      if (!L || !wrong) continue;
      const col = L.indexOf(wrong); if (col < 0) continue;
      if (addFinding({ line: ln, col, lineText: L, wrong, right: String(d.right ?? ""), type: String(d.type || "맞춤법"), reason: String(d.reason || ""), src: "Claude" })) n++;
    }
    return n;
  }
  $("claudeRun").onclick = () => { if (sample) runExternal("Claude", claudeChunk); };

  function updateButtons() {
    $("bareunRun").hidden = !bareunTarget();
    $("claudeRun").hidden = !sample;
    $("bareunRun").disabled = $("claudeRun").disabled = !!extCtl;
    const viaKey = !!(store.get("wc-bareun-key") || "").trim();
    $("bareunRun").textContent = viaKey ? "바른 맞춤법 검사 (내 키)" : "바른 맞춤법 검사";
  }

  // ---------- 시작 ----------
  const draft = store.get("wc-draft");
  if (draft && draft.trim()) $("src").value = draft;
  updateButtons();
  if (window.claude && claude.use) {
    claude.use("sample").then((s) => { if (s) { sample = s; updateButtons(); } }).catch(() => {});
    claude.use("downloads").then((d) => { if (d) downloads = d; }).catch(() => {});
  }
  if (!draft || !draft.trim()) { $("src").value = EXAMPLE; $("fileinfo").textContent = "예시 원고"; run(); }
  else setMode("edit");
})();
</script>
</body>
</html>
